[package]
name = "dockify"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "sync"] }
