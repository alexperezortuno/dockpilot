[package]
name = "dockpilot"
version = "0.5.1"
edition = "2024"
description = "Keyboard-first Docker Engine and Docker Compose TUI"
repository = "https://github.com/alexperezortuno/dockpilot"

[dependencies]
bollard = { version = "0.19", features = ["ssh"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
tokio = { version = "1.48.0", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
serde_json = "1.0"
sysinfo = "0.39.6"
