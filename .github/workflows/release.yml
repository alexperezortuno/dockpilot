name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
          - os: macos-latest
            suffix: macos-aarch64
          - os: windows-latest
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package
          cp target/release/dockpilot package/
          cp README.md config.example.toml package/
          tar -czf "dockpilot-${{ github.ref_name }}-${{ matrix.suffix }}.tar.gz" -C package .
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/dockpilot.exe package/
          Copy-Item README.md,config.example.toml package/
          Compress-Archive -Path package/* -DestinationPath "dockpilot-${{ github.ref_name }}-${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dockpilot-${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
