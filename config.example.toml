# Copy this file to config.toml and adjust values as needed.

# Compose project folder and Docker working directory.
project_folder = "."

# Docker context name. Omit for the default context.
# docker_context = "default"

# Interface theme: dark, light, or mono.
theme = "dark"

[shortcuts]
cancel_task = "x"
toggle_focus = "m"
refresh = "r"
theme = "t"

# TUI event polling interval. Valid range: 10..=5000 milliseconds.
poll_interval_ms = 50
output_capacity = 2000

# Historical container metrics.
metrics_interval_ms = 1000
metrics_capacity = 120

# Background refresh. Resource intervals are valid from 1000 to 300000 ms.
auto_refresh = true
container_refresh_interval_ms = 5000
image_refresh_interval_ms = 30000
network_refresh_interval_ms = 30000
volume_refresh_interval_ms = 30000

# Layout and input preferences (persisted in dockpilot.preferences.toml).
show_output = true
show_details = true
compact_layout = false
mouse_enabled = false

# Omit a threshold to disable that alert.
alert_cpu_percent = 85.0
alert_memory_percent = 90.0
alert_cooldown_seconds = 30

# Policy defaults consumed by later safety-policy work.
safe_mode = true
read_only = false
